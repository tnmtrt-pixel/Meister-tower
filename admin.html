<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>マイスター杯 運営画面</title>
<style>
:root{--navy:#0B1730;--panel:#13244A;--line:#2C4682;--ink:#EAF1FF;--muted:#9FB3DA;--gold:#D9AE45;--gold-hi:#FFE08A;--good:#3DDC97;--low:#FF6B6B;--blue:#5B8CFF}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% -20%,#22408A,var(--navy) 60%);color:var(--ink);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Meiryo",system-ui,sans-serif;min-height:100vh}
button,input,select{font:inherit}
.btn{border:2px solid var(--gold);background:linear-gradient(#1E3A7A,#132A5C);color:var(--ink);border-radius:10px;padding:8px 14px;font-weight:800;cursor:pointer}
.btn.primary{background:linear-gradient(#FFE08A,#D9AE45);color:#2A1B00;border-color:#fff}
.btn.danger{border-color:var(--low);color:#FFB3B3}
.btn.small{padding:4px 8px;font-size:13px;border-width:1px}
.btn:disabled{opacity:.4;cursor:default}
input,select{background:#0A1430;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}
.wrap{max-width:1500px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
header h1{margin:0;font-size:20px;color:var(--gold-hi)}
.grow{flex:1}
.card{background:rgba(19,36,74,.92);border:2px solid var(--gold);border-radius:14px;padding:16px}
.main{display:grid;grid-template-columns:2fr 1fr;gap:16px}
@media (max-width:900px){.main{grid-template-columns:1fr}}
.title{font-size:44px;font-weight:900;line-height:1.1;color:#fff;text-shadow:0 3px 0 #000}
.sub{font-size:24px;font-weight:800;color:var(--gold-hi)}
.meta{color:var(--muted);margin-top:4px;font-size:18px}
.code{font-size:140px;font-weight:900;letter-spacing:.15em;color:var(--gold-hi);text-align:center;line-height:1;text-shadow:0 0 30px rgba(255,224,138,.5)}
.big{font-size:28px;font-weight:900}
.round{display:flex;align-items:center;justify-content:space-between;gap:12px}
.timer{font-size:64px;font-weight:900;font-variant-numeric:tabular-nums}
.timer.hot{color:var(--low)}
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:8px;margin-top:10px}
.tb{border:1px solid var(--line);border-radius:12px;padding:10px;background:rgba(10,20,48,.7)}
.tb.done{border-color:var(--good)}.tb.flag{border-color:var(--low);box-shadow:0 0 12px rgba(255,107,107,.5)}
.tb .no{font-weight:900;color:var(--gold-hi);font-size:18px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin:6px 0}
.pl{display:flex;align-items:center;gap:6px;min-width:0}
.pl img{width:38px;height:38px;border-radius:8px;border:2px solid var(--gold);object-fit:cover;background:#fff;flex:none}
.pl .nm{font-weight:800;font-size:14px;line-height:1.2;word-break:break-all}
.pl .tt{display:block;font-size:11px;color:var(--gold-hi)}
.pl.win .nm{color:var(--good)}.pl.lose{opacity:.5}
.st{font-size:13px;color:var(--muted)}
.ops{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
table{width:100%;border-collapse:collapse}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;font-size:15px}
th{color:var(--muted);font-size:12px}
td.n{font-weight:900;color:var(--gold-hi);width:2em}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:14px}
.chip.ok{border-color:var(--good);color:var(--good)}
.final{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center;margin:16px 0}
.final .side{text-align:center}
.final img{width:120px;height:120px;border-radius:16px;border:4px solid var(--gold);background:#fff;object-fit:cover}
.final .nm{font-size:26px;font-weight:900;margin-top:6px}
.party{display:flex;gap:4px;justify-content:center;margin-top:6px}.party img{width:44px;height:44px;border-width:2px}
.vsbig{font-size:60px;font-weight:900;color:var(--gold-hi)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#000;border:1px solid var(--gold);padding:10px 16px;border-radius:10px}
form.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
form.grid label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.hide{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🏆 マイスター杯 運営画面</h1>
    <select id="sel"></select>
    <button class="btn small" id="new">＋ 新しい大会</button>
    <button class="btn small" id="rk-open">ランキング管理</button>
    <span class="grow"></span>
    <button class="btn small" id="logout">ログアウト</button>
  </header>
  <div id="login" class="card hide">
    <div class="big">運営用パスワード</div>
    <p class="st">Cloudflare に登録した ADMIN_KEY を入れてください。</p>
    <input id="key" type="password" style="width:300px"> <button class="btn primary" id="go">入る</button>
    <p id="lerr" class="st" style="color:var(--low);font-weight:800"></p>
  </div>
  <div id="rk" class="card hide">
    <div class="big">ランキング管理</div>
    <p class="st">消したい人の「非表示」を押すと、すべてのランキングから見えなくなります（データは残るので「戻す」で元に戻せます）。</p>
    <p><select id="rk-type"><option value="lad">ランクバトル（今シーズン）</option><option value="inf">無限の塔 トータル（旧）</option><option value="infw">ウィークリー</option><option value="infd">デイリー</option></select>
      <button class="btn small" id="rk-load">読みこむ</button> <button class="btn small" id="rk-close">閉じる</button></p>
    <div id="rk-list"></div>
    <div id="rk-hid"></div>
  </div>
  <div id="create" class="card hide">
    <div class="big">新しい大会を作る</div>
    <form class="grid" id="cf">
      <label>大会名<input name="name" value="マイスター杯 2026"></label>
      <label>大会名（中国語）<input name="namezh" value="大师杯 2026"></label>
      <label>サブタイトル<input name="sub" value="第1戦・二学期中間"></label>
      <label>サブタイトル（中国語）<input name="subzh" value="第1战・第二学期期中"></label>
      <label>日時<input name="date" type="datetime-local" value="2026-10-23T19:00"></label>
      <label>場所<input name="place" value="オンライン"></label>
      <label>定員<input name="cap" type="number" value="16" min="2" max="64"></label>
      <label>スイスドローの回戦数（このあと決勝）<input name="rnum" type="number" value="3" min="1" max="6"></label>
    </form>
    <p class="st">オンライン大会：開始15分前に受付が自動で始まり（コード不要）、開始時刻に1回戦が自動で始まります。対戦の勝ち負けはサーバーが決め、全卓がそろうと次の回戦・決勝・終了まで自動で進みます。12分たっても来ない人は不戦敗です。</p>
    <p><button class="btn primary" id="cdo">作成する</button> <button class="btn" id="ccancel">やめる</button></p>
  </div>
  <div id="app" class="main hide">
    <div class="card" id="stage"></div>
    <div class="card" id="side"></div>
  </div>
</div>
<div class="toast hide" id="toast"></div>
<script src="engine.js?v=d62b200f"></script>
<script>
const G=window.ENGINE;
const API=(new URLSearchParams(location.search).get('api'))||'https://meister-tower-online.tnmtrt.workers.dev';
const $=s=>document.querySelector(s);
let KEY='';try{KEY=sessionStorage.getItem('mt-admin')||''}catch(e){}
let TID='',S=null,poll=null;
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.remove('hide');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add('hide'),3000)};
const esc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function adm(op,extra={}){const r=await fetch(API+'/api/cup/admin',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({key:KEY,op,tid:TID,...extra})});
  const j=await r.json().catch(()=>({}));if(r.status===403){showLogin();throw new Error('auth')}if(r.status===404&&!j.err)throw new Error('old');if(j.cup)S=j.cup;if(!r.ok)throw new Error(j.err||r.status);return j}
const nameOf=p=>p?(p.w||[]).slice(0,3).map((n,k)=>G.wordText(k,n)).join('')+'#'+p.tag:'';
const titleOf=p=>p&&p.title?(G.TITLE_NAMES[p.title]||[''])[0]:'';
const img=id=>{const c=G.byId(id);return c?`<img src="${c.img}" alt="">`:'<img alt="">'};
const plHTML=(p,cls='')=>p?`<div class="pl ${cls}">${img(p.icon)}<div><span class="tt">${esc(titleOf(p))}</span><span class="nm">${esc(nameOf(p))}</span></div></div>`:'<div class="pl"><span class="nm">—</span></div>';
const ERR={'need 2':'受付した人が2人以上必要です','final done':'決勝は終わっています。「大会を終了する」を押してください','final undecided':'決勝の結果がまだです','status':'今の状態ではできません'};
const errMsg=e=>{const m=String(e.message||e);if(m.startsWith('undecided:'))return`まだ結果が出ていない卓があります：${m.slice(10)}番`;return ERR[m]||m};

function showLogin(){$('#login').classList.remove('hide');$('#app').classList.add('hide');$('#create').classList.add('hide');clearInterval(poll)}
$('#go').onclick=async()=>{KEY=$('#key').value.trim();$('#lerr').textContent='確認しています…';try{sessionStorage.setItem('mt-admin',KEY)}catch(e){}await boot()};
async function why(r){/* ログインできない理由を表示する */
  if(r==='auth'){$('#lerr').textContent='パスワードがちがいます。または、Cloudflare に ADMIN_KEY がまだ登録されていません（登録後に Deploy が必要です）。';return}
  try{const t=await fetch(API+'/api/cup/pub');$('#lerr').textContent=t.status===404?'サーバーがまだ古い版です。Cloudflare の更新が終わるまで数分待ってください。':'サーバーにつながりません：'+r}catch(e){$('#lerr').textContent='サーバーにつながりません。通信環境を確認してください。'}}
$('#logout').onclick=()=>{KEY='';try{sessionStorage.removeItem('mt-admin')}catch(e){}showLogin()};
$('#new').onclick=()=>{$('#create').classList.remove('hide')};
$('#ccancel').onclick=()=>$('#create').classList.add('hide');
$('#cdo').onclick=async()=>{const f=new FormData($('#cf'));try{const j=await adm('create',{name:{ja:f.get('name'),zh:f.get('namezh')},sub:{ja:f.get('sub'),zh:f.get('subzh')},date:f.get('date'),place:f.get('place'),cap:+f.get('cap'),rnum:+f.get('rnum')});
  TID=j.cup.id;$('#create').classList.add('hide');toast('大会を作成しました。ゲームの「通信」タブに表示されます');await boot()}catch(e){toast(errMsg(e))}};
$('#sel').onchange=()=>{TID=$('#sel').value;refresh()};
/* ランキング管理：/api/rank で一覧、/api/admin で非表示（id の下4けた） */
async function rkAdmin(body){const r=await fetch(API+'/api/admin',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({key:KEY,...body})});const j=await r.json().catch(()=>({}));if(r.status===403)throw new Error('パスワードがちがいます');if(!r.ok)throw new Error(j.err||r.status);return j}
const rkName=w=>(w||[]).slice(0,3).map((n,k)=>G.wordText(k,n)).join('');
async function rkLoad(){const el=$('#rk-list');el.textContent='読みこんでいます…';
  try{const t=$('#rk-type').value,j=await (await fetch(API+'/api/rank?type='+t)).json();
    el.innerHTML='<table style="width:100%;border-collapse:collapse">'+(j.top||[]).map(x=>`<tr style="border-top:1px solid var(--line)"><td>${x.n}位</td><td>${img(x.icon)}</td><td><span class="tt">${esc(titleOf(x))}</span> <b>${esc(rkName(x.w))}</b><br><small>ID下4けた ${esc(x.id)}</small></td><td>${t==='lad'?(x.rank>=11?'マスター '+x.rate:'ランク'+x.rank+' ★'+x.stars):x.v+'F'}</td><td><button class="btn small danger" data-hide="${esc(x.id)}">非表示</button></td></tr>`).join('')+'</table>'||'だれもいません';
    el.querySelectorAll('[data-hide]').forEach(b=>b.onclick=async()=>{if(!confirm('この人をランキングから非表示にしますか？'))return;try{const r=await rkAdmin({id:b.dataset.hide,hide:true});toast(`${r.n}人を非表示にしました`);rkLoad()}catch(e){toast(String(e.message||e))}});
    const h=await rkAdmin({list:true}).catch(()=>null),hid=h&&h.users?h.users.filter(u=>u.hidden):[];
    $('#rk-hid').innerHTML=hid.length?'<div class="big" style="margin-top:14px;font-size:16px">非表示にしている人</div>'+hid.map(u=>{let w=[];try{w=JSON.parse(u.w)}catch(e){}return`<p>${esc(rkName(w))}（${esc(u.id.slice(-4))}） <button class="btn small" data-show="${esc(u.id)}">戻す</button></p>`}).join(''):'';
    $('#rk-hid').querySelectorAll('[data-show]').forEach(b=>b.onclick=async()=>{try{await rkAdmin({id:b.dataset.show,hide:false});toast('元に戻しました');rkLoad()}catch(e){toast(String(e.message||e))}})
  }catch(e){el.textContent='読みこめませんでした：'+(e.message||e)}}
$('#rk-open').onclick=()=>{if(!KEY){toast('先にパスワードで入ってください');return}$('#rk').classList.remove('hide');rkLoad()};
$('#rk-close').onclick=()=>$('#rk').classList.add('hide');
$('#rk-load').onclick=rkLoad;$('#rk-type').onchange=rkLoad;


async function boot(){try{const j=await adm('list');$('#login').classList.add('hide');
    const list=j.list||[];if(!TID&&list.length)TID=(list.filter(x=>x.status!=='done').pop()||list[list.length-1]).id;
    $('#sel').innerHTML=list.map(x=>`<option value="${x.id}" ${x.id===TID?'selected':''}>${esc(x.name.ja)}／${esc(x.sub.ja)}（${({open:'エントリー受付中',checkin:'当日受付中',play:'進行中',done:'終了'})[x.status]}）</option>`).join('')||'<option>大会がありません</option>';
    if(!list.length){$('#create').classList.remove('hide');$('#app').classList.add('hide');return}
    $('#app').classList.remove('hide');$('#lerr').textContent='';await refresh();clearInterval(poll);poll=setInterval(refresh,2000)}catch(e){showLogin();why(String(e.message||e))}}
async function refresh(){if(!TID)return;try{await adm("state")}catch(e){return}render()}
const act=(op,extra,confirmMsg)=>async()=>{if(confirmMsg&&!confirm(confirmMsg))return;try{await adm(op,extra);render();if(op==='delete'){TID='';boot()}}catch(e){toast(errMsg(e))}};

function render(){if(!S)return;const st=$('#stage'),sd=$('#side');
  const o=$('#sel').querySelector(`option[value="${S.id}"]`);if(o)o.textContent=`${S.name.ja}／${S.sub.ja}（${({open:'エントリー受付中',checkin:'当日受付中',play:'進行中',done:'終了'})[S.status]}）`;
  const clk=t=>{if(!t)return'—';const d=new Date(t+9*3600e3);return`${d.getUTCMonth()+1}/${d.getUTCDate()} ${d.getUTCHours()}:${String(d.getUTCMinutes()).padStart(2,'0')}`};
  const head=`<div class="title">${esc(S.name.ja)}</div><div class="sub">${esc(S.sub.ja)}</div><div class="meta">📅 ${esc(S.date.replace('T',' '))}　📍 ${esc(S.place)}</div>
    <div class="st" style="margin-top:6px">${S.online?`🤖 自動進行 ON（受付開始 ${clk(S.checkinAt)}・1回戦 ${clk(S.startAt)}）`:'🖐 教室モード（受付コード・運営がボタンで進める）'} <button class="btn small" id="b-online">${S.online?'教室モードにする':'自動進行にする'}</button></div>`;
  let body='',ctl='';
  const R=S.rounds[S.rounds.length-1],swissDone=S.rounds.filter(r=>!r.final).length>=S.rnum;
  if(S.status==='open'){
    body=`<p class="big">エントリー ${S.entries} / ${S.cap}人</p><div class="chips">${(S.players||[]).map(p=>`<span class="chip">${esc(nameOf(p))}</span>`).join('')}</div>`;
    ctl=`<button class="btn primary" id="b-checkin">${S.online?'今すぐ受付を始める（ふだんは自動）':'当日の受付を始める'}</button>`}
  else if(S.status==='checkin'){
    body=`${S.online?'<p class="big" style="text-align:center;margin:10px 0 0">受付中（ゲームの「受付する」ボタンで受付）</p>':`<p class="big" style="text-align:center;margin:10px 0 0">受付コード</p><div class="code">${esc(S.code)}</div>`}
      <p class="big" style="text-align:center">受付済み ${S.checked}人 ／ エントリー ${S.entries}人</p>
      <div class="chips">${(S.players||[]).map(p=>`<span class="chip ${p.chk?'ok':''}">${p.chk?'✓ ':''}${esc(nameOf(p))}</span>`).join('')}</div>`;
    ctl=`<button class="btn primary" id="b-start" ${S.checked<2?'disabled':''}>${S.online?'今すぐ第1回戦を始める（ふだんは開始時刻に自動）':'第1回戦を始める（受付を締め切る）'}</button>${S.online?'':' <button class="btn small" id="b-recode">受付コードを変える</button>'}`}
  else if(S.status==='play'&&R){
    if(R.final){const m=R.ms[0];const sideHTML=(p,k)=>`<div class="side">${img(p.icon)}<div class="st">${esc(titleOf(p))}</div><div class="nm" style="${m.win?(m.win===k?'color:var(--good)':'opacity:.5'):''}">${esc(nameOf(p))}</div></div>`;
      body=`<div class="round"><div class="big">🏆 決勝</div><div class="timer" id="tm"></div></div>
        <div class="final">${sideHTML(m.a,'a')}<div class="vsbig">VS</div>${sideHTML(m.b,'b')}</div>
        <div class="st" style="text-align:center">${m.win?(m.win==='-'?'両者不戦敗':'決着！'):S.online?`対戦待ち（入室 ${m.here||0}/2）`:m.flag?'⚠ 結果が食い違っています':`報告 ${m.rep}/2`}　ルーム ${esc(m.room)}</div>
        <div class="ops" style="justify-content:center"><button class="btn small" data-w="a" data-t="1">左の勝ち</button><button class="btn small" data-w="b" data-t="1">右の勝ち</button><button class="btn small" data-redo="1">やり直し</button></div>`;
      ctl=`<button class="btn primary" id="b-finish" ${m.win||m.rep===1?'':'disabled'}>大会を終了する（報酬と殿堂）</button>`}
    else{
      body=`<div class="round"><div class="big">第${S.rounds.length}回戦</div><div class="timer" id="tm"></div></div>
        <div class="tables">${R.ms.slice().sort((a,b)=>(a.t||99)-(b.t||99)).map(m=>{if(!m.b)return`<div class="tb done"><div class="no">不戦勝</div>${plHTML(m.a,'win')}</div>`;
          const cls=m.win?'done':m.flag?'flag':'';
          return`<div class="tb ${cls}"><div class="no">${m.t}番テーブル</div><div class="vs">${plHTML(m.a,m.win?(m.win==='a'?'win':'lose'):'')}<b>vs</b>${plHTML(m.b,m.win?(m.win==='b'?'win':'lose'):'')}</div>
            <div class="st">${m.win?(m.win==='-'?'✓ 両者不戦敗':'✓ 決着'):S.online?`対戦待ち・対戦中（入室 ${m.here||0}/2）`:m.flag?'⚠ 結果が食い違っています':`対戦中（報告 ${m.rep}/2）`}${S.online?'':`　確認コード ${esc((m.room||'').slice(1,5))}`}</div>
            <div class="ops"><button class="btn small" data-w="a" data-t="${m.t}">A（左）の勝ち</button><button class="btn small" data-w="b" data-t="${m.t}">B（右）の勝ち</button><button class="btn small" data-redo="${m.t}">やり直し</button></div></div>`}).join('')}</div>`;
      const left=R.ms.filter(m=>!m.win).length;
      ctl=`<button class="btn primary" id="b-start">${swissDone?'決勝を始める':`第${S.rounds.length+1}回戦を始める`}</button> <span class="st">${left?`未決着 ${left}卓（片方だけ報告がある卓は、その報告で確定します）`:'全卓決着'}</span>`}}
  else if(S.status==='done'){const c=S.stand[0],r=S.stand[1];
    body=`<div class="big" style="text-align:center;margin-top:10px">🏆 優勝</div><div class="final" style="grid-template-columns:1fr"><div class="side">${c?img(c.icon):''}<div class="st">${esc(titleOf(c))}</div><div class="nm" style="font-size:40px">${esc(nameOf(c))}</div></div></div>
      ${r?`<div style="text-align:center" class="big">🥈 準優勝　${esc(nameOf(r))}</div>`:''}<p class="st" style="text-align:center">参加者全員に30コインが届きました。ゲームの「通信」タブから受け取れます。</p>`}
  st.innerHTML=head+body+`<div class="ops" style="margin-top:14px">${ctl}</div>`;
  sd.innerHTML=`<div class="big">順位表</div><table><tr><th></th><th>名前</th><th>勝敗</th><th>相手の勝数</th><th></th></tr>${(S.stand||[]).map(p=>{const pl=(S.players||[]).find(x=>x.tag===p.tag);
      return`<tr style="${p.drop?'opacity:.4':''}"><td class="n">${p.n}</td><td>${esc(nameOf(p))}</td><td>${p.wl[0]}-${p.wl[1]}</td><td>${p.bh}</td><td>${S.status==='play'&&pl?`<button class="btn small" data-drop="${pl.pid}" data-on="${!p.drop}">${p.drop?'戻す':'棄権'}</button>`:''}</td></tr>`}).join('')}</table>
    <div class="ops" style="margin-top:14px"><button class="btn small" id="b-edit">大会情報を変更</button><button class="btn small danger" id="b-del">この大会を削除</button>${S.status==='play'?'<button class="btn small danger" id="b-force">決勝なしで終了</button>':''}</div>`;
  const on=(id,f)=>{const b=$('#'+id);if(b)b.onclick=f};
  on('b-checkin',act('checkin'));on('b-online',act('online',{on:!S.online},S.online?'教室モード（受付コード・手動で進行）に切り替えますか？':'自動進行に切り替えますか？'));on('b-recode',act('checkin',{},'受付コードを変えますか？'));on('b-start',act('start'));
  on('b-finish',act('finish',{},'大会を終了して、報酬と殿堂を確定しますか？'));on('b-force',act('finish',{force:true},'決勝をせずに今の順位で終了しますか？（優勝者はなし）'));
  on('b-del',act('delete',{},'この大会を削除しますか？元に戻せません'));
  on('b-edit',async()=>{const date=prompt('日時（例 2026-10-23T19:00）',S.date);if(date==null)return;const place=prompt('場所',S.place);if(place==null)return;try{await adm('edit',{date,place});render()}catch(e){toast(errMsg(e))}});
  document.querySelectorAll('[data-w]').forEach(b=>b.onclick=act('win',{t:+b.dataset.t,w:b.dataset.w},'この卓の勝者を決めますか？'));
  document.querySelectorAll('[data-redo]').forEach(b=>b.onclick=act('redo',{t:+b.dataset.redo},'この卓をやり直しますか？（新しい部屋になります）'));
  document.querySelectorAll('[data-drop]').forEach(b=>b.onclick=act('drop',{pid:b.dataset.drop,on:b.dataset.on==='true'}));
  tick()}
function tick(){const el=$('#tm');if(!el||!S||!S.start)return;const left=Math.max(0,S.start+S.roundMs-Date.now()),m=Math.floor(left/60000),s=Math.floor(left%60000/1000);
  el.textContent=left?`${m}:${String(s).padStart(2,'0')}`:'TIME UP';el.classList.toggle('hot',left<60000)}
setInterval(tick,500);
if(KEY)boot();else showLogin();
</script>
</body>
</html>
